[package]
name = "archypix-resolver"
version = "0.1.0"
edition = "2024"

[dependencies]
archypix-common = { path = "../common", features = ["auth", "routine", "settings", "registration", "error", "sqlx"] }
tokio = { version = "1.42", features = ["full"] }
axum = "0.8.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
moka = { version = "0.12", features = ["future"] }
arc-swap = "1"
anyhow = "1.0"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
strum = { version = "0.26", features = ["derive"] }
rand = { version = "0.10", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
